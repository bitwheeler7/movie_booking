<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="/frontend/"><title>My bookings | MovieBook</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="site-header"></div><main class="page-container content-section"><div class="section-heading"><div><span class="eyebrow">YOUR MOVIE PLANS</span><h1>My bookings</h1></div><a class="button button-outline" href="index.html">Browse movies</a></div><p class="muted">This backend has no booking-list endpoint. This page shows bookings created in this browser session and fetches each record from Booking Service.</p><div id="booking-list" class="booking-list"></div></main><dialog id="cancel-dialog" class="confirm-dialog"><form method="dialog"><h2>Cancel this booking?</h2><p>Cancellation eligibility and any refund are decided by the backend.</p><label>Reason<input id="cancel-reason" maxlength="255" value="Personal reason"></label><div class="dialog-actions"><button class="button button-outline" value="cancel">Keep booking</button><button id="confirm-cancel" class="button button-primary" value="confirm">Confirm cancellation</button></div></form></dialog><div id="site-footer"></div><div id="toast-region" class="toast-region" aria-live="polite"></div><details id="api-debug" class="debug-panel"><summary>API activity <span id="debug-count">0</span></summary><div id="debug-list" class="debug-list"></div></details><script defer src="js/config.js"></script><script defer src="js/api.js"></script><script defer src="js/app.js"></script><script defer src="js/auth.js"></script><script defer src="js/tickets.js"></script></body></html>
