<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="/frontend/"><title>Select seats | MovieBook</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="site-header"></div><main class="page-container"><div class="booking-top"><a class="back-link" id="back-to-shows" href="index.html">← Back to movies</a><div id="show-summary"></div></div><section id="seat-section" class="seat-card"><div class="section-heading"><div><span class="eyebrow">YOUR SEATS</span><h1>Select seats</h1></div><button id="refresh-seats" class="button button-outline" type="button">↻ Refresh availability</button></div><div class="screen-label"><span></span><b>SCREEN</b><span></span></div><div id="seat-status" class="inline-status"></div><div id="seat-grid" class="seat-grid" aria-label="Seat availability"></div><div class="seat-legend"><span><i class="seat-dot available"></i>Available</span><span><i class="seat-dot selected"></i>Selected</span><span><i class="seat-dot locked"></i>Temporarily locked</span><span><i class="seat-dot booked"></i>Booked</span></div><div class="seat-checkout"><div><small>SELECTED SEATS</small><p id="selected-seats">None</p></div><div><small>TOTAL</small><p id="seat-total">₹0.00</p></div><button id="lock-seats" class="button button-primary" type="button" disabled>Continue</button></div></section><section id="checkout-section" class="checkout-card" hidden><div id="lock-state"></div><div id="payment-state"></div><div class="checkout-actions"><button id="create-payment" class="button button-primary" type="button">Create payment intent</button><button id="release-lock" class="button button-outline" type="button">Release seats</button><a id="open-confirmation" class="button button-light" href="#" hidden>View booking</a></div></section></main><div id="site-footer"></div><div id="toast-region" class="toast-region" aria-live="polite"></div><details id="api-debug" class="debug-panel"><summary>API activity <span id="debug-count">0</span></summary><div id="debug-list" class="debug-list"></div></details><script defer src="js/config.js"></script><script defer src="js/api.js"></script><script defer src="js/app.js"></script>
