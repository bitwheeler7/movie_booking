<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/frontend/">
  <meta name="description" content="Browse movies and book seats with MovieBook.">
  <title>Movie Booking system | Movies near you</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
   
    <section class="content-section" id="movies">
      <div class="section-heading">
        <div><span class="eyebrow">NOW SHOWING</span><h2>Movies to watch</h2></div>
        <label class="search-box"><span aria-hidden="true">⌕</span><input id="movie-search" type="search" placeholder="Search movies" autocomplete="off"></label>
      </div>
      <div id="movies-status" class="inline-status" aria-live="polite"></div>
      <div id="movie-grid" class="movie-grid"></div>
      <div id="movie-pagination" class="pagination"></div>
    </section>
    <section class="feature-strip"><div><span class="feature-icon">01</span><p><strong>Find your film</strong><br>Browse real listings from the catalog.</p></div><div><span class="feature-icon">02</span><p><strong>Pick your seats</strong><br>Availability is refreshed from the API.</p></div><div><span class="feature-icon">03</span><p><strong>Book with confidence</strong><br>Your booking is confirmed by the backend.</p></div></section>
  </main>
  <div id="site-footer"></div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <details id="api-debug" class="debug-panel"><summary>activity <span id="debug-count">0</span></summary><div id="debug-list" class="debug-list"><p class="muted">Requests made by this page appear here. Credentials are masked.</p></div></details>
  <script defer src="js/config.js"></script><script defer src="js/api.js"></script><script defer src="js/app.js"></script><script defer src="js/auth.js"></script><script defer src="js/movies.js"></script>
</body>
</html>
